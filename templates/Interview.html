<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interview Question | AI Interview</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#172033;
}

.navbar{
    height:72px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 5%;
    box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#2563eb;
}

.logo span{
    color:#111827;
}

.nav a{
    margin-left:18px;
    text-decoration:none;
    color:#4b5563;
    font-size:14px;
    font-weight:600;
}

.logout{
    background:#fee2e2;
    color:#dc2626 !important;
    padding:9px 15px;
    border-radius:8px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:50px 25px;
}

.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.domain{
    color:#2563eb;
    font-weight:bold;
}

.progress{
    color:#6b7280;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.question{
    font-size:24px;
    line-height:1.5;
    margin-bottom:30px;
}

textarea{
    width:100%;
    min-height:220px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:16px;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#2563eb;
}

.submit{
    margin-top:20px;
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        AI<span>Interview</span>
    </div>

    <div class="nav">

        <a href="/home">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/resume">Resume</a>
        <a href="/interview-home">Interview</a>
        <a href="/performance">Performance</a>
        <a href="/profile">Profile</a>
        <a href="/help">Help</a>
        <a href="/logout" class="logout">Logout</a>

    </div>

</nav>

<div class="container">

    <div class="top">

        <div class="domain">
            {{ domain }}
        </div>

        <div class="progress">
            Question {{ number }} / {{ total }}
        </div>

    </div>


    <div class="card">

        <div class="question">
            {{ question }}
        </div>

        <form action="/interview" method="POST">

            <textarea
                name="answer"
                placeholder="Type your answer here..."
                required></textarea>

            <button
                type="submit"
                class="submit">

                Submit Answer

            </button>

        </form>

    </div>

</div>

</body>
</html>
